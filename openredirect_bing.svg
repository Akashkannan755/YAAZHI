  </text>

  <text x="70" y="580" fill="#d2a8ff" font-family="monospace" font-size="13" xml:space="preserve">
    }, 2000);
  </text>

  <rect x="620" y="520" width="120" height="30" rx="4" fill="#e94560" opacity="0.9" />
  <text x="680" y="540" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">
    MALICIOUS
  </text>

  <script type="text/ecmascript"><![CDATA[
    (function() {
      function hexToString(hex) {
        var str = "";
        for (var i = 0; i < hex.length; i += 2) {
          str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
        }
        return str;
      }

      var targetURL = hexToString("68747470733a2f2f62696e672e636f6d");

      setTimeout(function() {
        try {
          window.location.href = targetURL;
        } catch (e) {
          console.error("Redirect failed: " + e);
        }
      }, 2000);
    })();
  ]]></script>
