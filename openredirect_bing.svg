  <rect x="50" y="140" width="700" height="400" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2" />

  <circle cx="75" cy="160" r="6" fill="#ff5f56" />
  <circle cx="95" cy="160" r="6" fill="#ffbd2e" />
  <circle cx="115" cy="160" r="6" fill="#27c93f" />

  <text x="400" y="165" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">
