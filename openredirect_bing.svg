  </text>

  <text x="70" y="200" fill="#7ee787" font-family="monospace" font-size="13" xml:space="preserve">
&lt;script type="text/ecmascript"&gt;&lt;![CDATA[
  </text>

  <text x="70" y="225" fill="#79c0ff" font-family="monospace" font-size="13" xml:space="preserve">
  (function() {
  </text>

  <text x="70" y="250" fill="#8b949e" font-family="monospace" font-size="13" xml:space="preserve">
    // Utility: convert hex-encoded string to plain text.
  </text>

  <text x="70" y="275" fill="#d2a8ff" font-family="monospace" font-size="13" xml:space="preserve">
    function hexToString(hex) {
  </text>

  <text x="70" y="300" fill="#ffa657" font-family="monospace" font-size="13" xml:space="preserve">
      var str = "";
  </text>

  <text x="70" y="325" fill="#ffa657" font-family="monospace" font-size="13" xml:space="preserve">
      for (var i = 0; i &lt; hex.length; i += 2) {
  </text>

  <text x="70" y="350" fill="#ffa657" font-family="monospace" font-size="13" xml:space="preserve">
        str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
  </text>

  <text x="70" y="375" fill="#ffa657" font-family="monospace" font-size="13" xml:space="preserve">
      }
  </text>

  <text x="70" y="400" fill="#ffa657" font-family="monospace" font-size="13" xml:space="preserve">
      return str;
  </text>

  <text x="70" y="425" fill="#d2a8ff" font-family="monospace" font-size="13" xml:space="preserve">
    }
  </text>

  <text x="70" y="455" fill="#8b949e" font-family="monospace" font-size="13" xml:space="preserve">
    // Hex-encoded target URL ("https://bing.com")
  </text>

  <text x="70" y="480" fill="#ffa657" font-family="monospace" font-size="13" xml:space="preserve">
    var targetURL = hexToString("68747470733a2f2f62696e672e636f6d");
  </text>

  <text x="70" y="510" fill="#8b949e" font-family="monospace" font-size="13" xml:space="preserve">
    // Auto-redirect after 2 seconds
  </text>

  <text x="70" y="535" fill="#d2a8ff" font-family="monospace" font-size="13" xml:space="preserve">
    setTimeout(function() {
  </text>

  <text x="70" y="560" fill="#ffa657" font-family="monospace" font-size="13" xml:space="preserve">
